name: Habitat desktop and ESP32-S3
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [desktop, sanitize]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure (SDL compiled locally from pinned source)
        run: cmake --preset ${{ matrix.preset }} -DDAEMON_SYSTEM_SDL=OFF
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Architecture boundaries
        run: python3 tools/check_architecture.py
      - name: Clang static analysis of C++ core, adapters and shared presentation
        if: matrix.preset == 'desktop'
        run: |
          cmake --preset core -DDAEMON_STATIC_ANALYSIS=ON
          cmake --build --preset core --target daemon_core
          python3 tools/analyze.py --build-dir build/desktop
  embedded:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pinned SDK and tools locally
        run: python3 tools/bootstrap_embedded.py
      - name: Cross-build ESP32-S3 shared core and presentation
        run: python3 tools/idf.py build
      - name: Firmware memory report
        run: python3 tools/firmware_report.py
  # Hardware, Android, network endpoints and battery endurance are not CI claims.
